stages:
  - verify
  - deploy

frontend:ci:
  stage: verify
  image: node:22-alpine
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  cache:
    key:
      files:
        - client/yarn.lock
    paths:
      - .yarn-cache/
      - client/node_modules/
  script:
    - yarn --cwd client install --frozen-lockfile --cache-folder "$CI_PROJECT_DIR/.yarn-cache"
    - yarn --cwd client next typegen
    - yarn --cwd client tsc --noEmit
    - yarn --cwd client lint
    - yarn --cwd client test --ci
    - NEXT_PUBLIC_API_URL=http://localhost:8080 yarn --cwd client build

backend:ci:
  stage: verify
  image: eclipse-temurin:21-jdk
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - server/minibank/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd server/minibank
    - chmod +x mvnw
    - ./mvnw -B test-compile
    - ./mvnw -B test -Dtest=AuthServiceTests,BurnRateCalculatorTest,CategorizationEngineTests,RuleMatcherTests,JwtConfigTests,NbpCurrencyServiceIntegrationTest,SettlementCalculatorTest,SplitCalculatorTest,SubscriptionDetectorTests,MBankCsvParserTest,PkoBpCsvParserTest,RevolutParserTest

deploy:frontend:
  stage: deploy
  image: node:22-alpine
  needs:
    - frontend:ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feature/ci-cd"'
      when: manual
  script:
    - npm install -g vercel
    - cd client
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

deploy:backend:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - backend:ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feature/ci-cd"'
      when: manual
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$ACR_USERNAME" "$ACR_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"vibrumacr2026.azurecr.io":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/server/minibank"
      --dockerfile "$CI_PROJECT_DIR/server/minibank/Dockerfile"
      --destination "vibrumacr2026.azurecr.io/vibrum-backend:$CI_COMMIT_SHORT_SHA"
    - |
      wget -qO- --header="Content-Type: application/json" \
        --post-data="{\"image\":\"vibrumacr2026.azurecr.io/vibrum-backend:$CI_COMMIT_SHORT_SHA\"}" \
        "$AZURE_DEPLOY_HOOK"
