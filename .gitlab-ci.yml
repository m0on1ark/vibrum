stages:
  - verify
  - package
  - deploy

frontend:ci:
  stage: verify
  image: node:22-alpine
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  cache:
    key:
      files:
        - client/yarn.lock
    paths:
      - .yarn-cache/
      - client/node_modules/
  script:
    - yarn --cwd client install --frozen-lockfile --cache-folder "$CI_PROJECT_DIR/.yarn-cache"
    - yarn --cwd client next typegen
    - yarn --cwd client tsc --noEmit
    - yarn --cwd client lint
    - yarn --cwd client test --ci
    - NEXT_PUBLIC_API_URL=http://localhost:8080 yarn --cwd client build

backend:ci:
  stage: verify
  image: eclipse-temurin:21-jdk
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - server/minibank/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd server/minibank
    - chmod +x mvnw
    - ./mvnw -B test -Dtest=AuthServiceTests,BurnRateCalculatorTest,CategorizationEngineTests,RuleMatcherTests,JwtConfigTests,NbpCurrencyServiceIntegrationTest,SettlementCalculatorTest,SplitCalculatorTest,SubscriptionDetectorTests,MBankCsvParserTest,PkoBpCsvParserTest,RevolutParserTest
    - ./mvnw -B -q package -DskipTests
  artifacts:
    paths:
      - server/minibank/target/*.jar
    expire_in: 1 hour

package:backend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - backend:ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feature/ci-cd"'
      when: manual
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$ACR_USERNAME" "$ACR_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"vibrumacr2026.azurecr.io":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
    - |
      cat <<'EOF' > "$CI_PROJECT_DIR/server/minibank/target/Dockerfile.ci"
      FROM eclipse-temurin:21-jre
      WORKDIR /app
      COPY minibank-*.jar app.jar
      USER 1001
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
    - /kaniko/executor
      --custom-platform=linux/amd64
      --context "$CI_PROJECT_DIR/server/minibank/target"
      --dockerfile "$CI_PROJECT_DIR/server/minibank/target/Dockerfile.ci"
      --destination "vibrumacr2026.azurecr.io/vibrum-backend:$CI_COMMIT_SHORT_SHA"

deploy:backend:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - package:backend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feature/ci-cd"'
  script:
    - |
      curl -fsSL -X POST "$AZURE_DEPLOY_HOOK" \
        -H "Content-Type: application/json" \
        -d "{\"image\":\"vibrumacr2026.azurecr.io/vibrum-backend:$CI_COMMIT_SHORT_SHA\"}"

deploy:frontend:
  stage: deploy
  image: node:22-alpine
  needs:
    - frontend:ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "feature/ci-cd"'
      when: manual
  script:
    - npm install -g vercel
    - cd client
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
