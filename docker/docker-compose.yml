name: minibank

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-minibank}
      POSTGRES_USER: ${DB_USERNAME:-minibank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-minibank}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../server/minibank
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-minibank}
      DB_USERNAME: ${DB_USERNAME:-minibank}
      DB_PASSWORD: ${DB_PASSWORD:-minibank}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
