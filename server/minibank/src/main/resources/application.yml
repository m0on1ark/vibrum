spring:
  application:
    name: minibank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minibank}
    username: ${DB_USERNAME:minibank}
    password: ${DB_PASSWORD:minibank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:15m}
  auth:
    refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:30d}
    password-reset-expiration: ${PASSWORD_RESET_EXPIRATION:30m}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:no-reply@minibank.local}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
